<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>天気APIテスト</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light text-dark">
  <div class="container py-4">
    <h1 class="mb-4 text-center">天気情報テスト</h1>

    <div class="mb-3 text-center">
      <button class="btn btn-primary" onclick="getLocation()">現在地から情報取得</button>
    </div>

    <div class="mb-4">
      <label for="city" class="form-label">都市名</label>
      <input type="text" class="form-control" id="city" placeholder="Tokyo">
    </div>

    <div class="row">
      <div class="col">
        <label for="lat" class="form-label">緯度</label>
        <input type="text" class="form-control" id="lat" readonly>
      </div>
      <div class="col">
        <label for="lon" class="form-label">経度</label>
        <input type="text" class="form-control" id="lon" readonly>
      </div>
    </div>

    <div id="locationStatus" class="text-muted mt-3"></div>
  </div>

  <script>
    function getLocation() {
      if (!navigator.geolocation) {
        document.getElementById('locationStatus').textContent = '位置情報がサポートされていません。';
        return;
      }

      document.getElementById('locationStatus').textContent = '位置情報を取得中...';

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          document.getElementById('lat').value = lat.toFixed(5);
          document.getElementById('lon').value = lon.toFixed(5);
          document.getElementById('locationStatus').textContent = '位置情報を取得しました。';

          // 都市名取得 (OpenCageやNominatimのような逆ジオコーディングAPIが必要)
          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
          const data = await response.json();
          const city = data.address.city || data.address.town || data.address.village || data.address.state || "不明";
          document.getElementById('city').value = city;
        },
        () => {
          document.getElementById('locationStatus').textContent = '位置情報の取得に失敗しました。';
        }
      );
    }
  </script>
</body>
</html>
